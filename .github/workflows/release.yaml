name: "Release"
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - name: "Publish Templates"
        uses: devcontainers/action@v1
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Login to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish Images"
        uses: devcontainers/ci@v0.3
        with:
          push: always
          configFile: "./src/sandbox/.devcontainer/devcontainer.json"
          imageName: "ghcr.io/silvecor/sandbox"
          cacheFrom: "ghcr.io/silvecor/sandbox"
          imageTag: latest,${{ github.sha }}
